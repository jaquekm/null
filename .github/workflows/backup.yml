name: Backup do banco

# 7.1 — backup diário do Postgres do Supabase, fora do Supabase e da Vercel,
# criptografado com `age` antes de sair do runner. Configuração necessária
# (ver docs/PROGRESSO.md e a mensagem do Claude Code que apontou pra este
# arquivo): secrets SUPABASE_DB_URL, BACKUP_AGE_PUBLIC_KEY,
# BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET, BACKUP_S3_ACCESS_KEY_ID,
# BACKUP_S3_SECRET_ACCESS_KEY, BACKUP_S3_REGION e BACKUP_REPORT_SECRET
# (mesmo valor da variável de ambiente do app); variável (não-secreta)
# APP_URL.
on:
  schedule:
    # 03:00 em America/Sao_Paulo (UTC-3, sem horário de verão) = 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente PostgreSQL 17 e age
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 age

      - name: Dump do banco
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            --file="hub-$(date +%F).dump"

      - name: Criptografar
        env:
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          age -r "$BACKUP_AGE_PUBLIC_KEY" -o "hub-$(date +%F).dump.age" "hub-$(date +%F).dump"
          rm "hub-$(date +%F).dump"

      - name: Enviar pro bucket
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
        run: |
          set -euo pipefail
          FILE="hub-$(date +%F).dump.age"
          DEST="db/$(date +%Y)/$(date +%m)/$FILE"
          aws s3 cp "$FILE" "s3://${{ secrets.BACKUP_S3_BUCKET }}/$DEST" --endpoint-url "${{ secrets.BACKUP_S3_ENDPOINT }}"
          echo "size=$(stat -c%s "$FILE")" >> "$GITHUB_OUTPUT"
          echo "location=$DEST" >> "$GITHUB_OUTPUT"

      # Retenção (diário 30 dias / mensal do dia 1 por 12 meses) é uma regra
      # de ciclo de vida configurada no próprio bucket ([HUMANO], ver o
      # enunciado da 7.1) — mais simples e confiável do que apagar objetos
      # aqui via script.

      - name: Registrar sucesso
        if: success()
        env:
          BACKUP_REPORT_SECRET: ${{ secrets.BACKUP_REPORT_SECRET }}
        run: |
          curl -fsS -X POST "${{ vars.APP_URL }}/api/ops/backup-report" \
            -H "Authorization: Bearer $BACKUP_REPORT_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"database\",\"status\":\"success\",\"sizeBytes\":${{ steps.upload.outputs.size }},\"location\":\"${{ steps.upload.outputs.location }}\"}"

      - name: Registrar falha
        if: failure()
        env:
          BACKUP_REPORT_SECRET: ${{ secrets.BACKUP_REPORT_SECRET }}
        run: |
          curl -fsS -X POST "${{ vars.APP_URL }}/api/ops/backup-report" \
            -H "Authorization: Bearer $BACKUP_REPORT_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"kind":"database","status":"failed","detail":"Um dos passos do workflow backup.yml falhou — ver o log do run no GitHub Actions."}' \
          || true
